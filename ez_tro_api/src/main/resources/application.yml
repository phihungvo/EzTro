server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  cache:
    type: simple
    cache-names:
      - userPermissions
      - rolePermissions

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false
    default-schema: tevc_cms
    drop-first: false
    contexts: development, production

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: false

#  session:
#    store-type: hash_map

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
            trust: smtp.gmail.com
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000
        debug: ${MAIL_DEBUG}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  base-path: ${MINIO_BASE_PATH:/uploads}

logging:
  level:
    root: INFO
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/uploads}

app:
  jobs:
    contract-status-sync:
      cron: ${CONTRACT_STATUS_SYNC_CRON:0 10 0 * * *}
      batch-size: ${CONTRACT_STATUS_SYNC_BATCH_SIZE:100}
  system-config:
    default-plan-id: ${DEFAULT_PLAN_ID:}
  billing:
    discrepancy:
      threshold: ${BILLING_DISCREPANCY_THRESHOLD:0.01}
    notification:
      reminder-days: ${BILLING_REMINDER_DAYS:3,1}
      reminder-cron: ${BILLING_REMINDER_CRON:0 30 8 * * ?}
    penalty:
      grace-days: ${BILLING_PENALTY_GRACE_DAYS:0}
      fixed-fee: ${BILLING_PENALTY_FIXED_FEE:0}
      percent-fee: ${BILLING_PENALTY_PERCENT_FEE:0}
      daily-amount: ${BILLING_PENALTY_DAILY_AMOUNT:50000}
      daily-threshold-days: ${BILLING_PENALTY_DAILY_THRESHOLD_DAYS:3}
      percent-threshold-days: ${BILLING_PENALTY_PERCENT_THRESHOLD_DAYS:10}
      percent-rate: ${BILLING_PENALTY_PERCENT_RATE:0.0}
  notifications:
    delivery:
      max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:3}
      retry-backoff-minutes: ${NOTIFICATION_DELIVERY_RETRY_BACKOFF_MINUTES:15}
      processor:
        fixed-delay-ms: ${NOTIFICATION_DELIVERY_PROCESSOR_DELAY_MS:60000}
    channels:
      sms:
        enabled: ${NOTIFICATION_SMS_ENABLED:false}
        simulate: ${NOTIFICATION_SMS_SIMULATE:true}
      zalo:
        enabled: ${NOTIFICATION_ZALO_ENABLED:false}
        simulate: ${NOTIFICATION_ZALO_SIMULATE:true}
  incidents:
    notification:
      escalation:
        cron: ${INCIDENT_ESCALATION_CRON:0 0 9 * * ?}
        pending-hours: ${INCIDENT_PENDING_ESCALATION_HOURS:48}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
