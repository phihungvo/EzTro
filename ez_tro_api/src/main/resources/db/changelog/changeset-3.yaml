databaseChangeLog:
  - changeSet:
      id: 3
      author: codex
      changes:
        - createTable:
            tableName: system_configs
            columns:
              - column:
                  name: id
                  type: INT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: config_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: config_value
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
        - addUniqueConstraint:
            tableName: system_configs
            columnNames: config_key
            constraintName: uk_system_configs_key
