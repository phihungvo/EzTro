databaseChangeLog:
  - changeSet:
      id: 7-contract-idempotency-01
      author: codex
      changes:
        - createTable:
            tableName: contract_operation_logs
            columns:
              - column:
                  name: id
                  type: INT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: INT
              - column:
                  name: contract_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: operation_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: request_id
                  type: VARCHAR(120)
              - column:
                  name: actor_id
                  type: INT
              - column:
                  name: result_json
                  type: LONGTEXT
              - column:
                  name: metadata_json
                  type: LONGTEXT
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: contract_operation_logs
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_contract_operation_logs_organization
        - addForeignKeyConstraint:
            baseTableName: contract_operation_logs
            baseColumnNames: contract_id
            referencedTableName: contracts
            referencedColumnNames: id
            constraintName: fk_contract_operation_logs_contract
        - addForeignKeyConstraint:
            baseTableName: contract_operation_logs
            baseColumnNames: actor_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_contract_operation_logs_actor
        - addUniqueConstraint:
            tableName: contract_operation_logs
            columnNames: contract_id, operation_type, idempotency_key
            constraintName: uk_contract_operation_logs_idempotency
        - createIndex:
            tableName: contract_operation_logs
            indexName: idx_contract_operation_logs_request
            columns:
              - column:
                  name: request_id
