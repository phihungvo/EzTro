databaseChangeLog:
  - changeSet:
      id: 8-contract-operation-status-01
      author: codex
      changes:
        - addColumn:
            tableName: contract_operation_logs
            columns:
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: COMPLETED
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: DATETIME
        - createIndex:
            tableName: contract_operation_logs
            indexName: idx_contract_operation_logs_status
            columns:
              - column:
                  name: status
