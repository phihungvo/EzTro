databaseChangeLog:
  - changeSet:
      id: 14-01-create-scheduled-job-locks
      author: openai
      changes:
        - createTable:
            tableName: scheduled_job_locks
            columns:
              - column:
                  name: job_key
                  type: VARCHAR(120)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: locked_until
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: locked_by
                  type: VARCHAR(120)
              - column:
                  name: last_started_at
                  type: TIMESTAMP
              - column:
                  name: last_finished_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
