version: "3.3"

services:
  backend:
    build: ./ez_tro_api
    image: ez_tro_api
    platform: linux/amd64
#    env_file:
#      - ./ez_tro_api/.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ez_tro_dev
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET=QQU0Alvur6b2dBvD5pcC4C3mlRgSm9OUTfrGJMFtFlU=
      - JWT_EXPIRATION=360000000
      - FILE_UPLOAD_DIR=/uploads
      - MAIL_DRIVER=SMTP
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=vophihung98765@gmail.com
      - MAIL_PASSWORD=ypzmyswugtdpumhq
      - MAIL_ENCRYPTION=TLS
      - MAIL_DEBUG=true
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=ez-tro
      - MINIO_REGION=local
      - MINIO_BASE_PATH=/uploads
      - MINIO_BROWSER_LICENSE=off
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - REDIS_CLUSTER=false

      - SPRING_DATA_REDIS_SSL=false
      - SPRING_REDIS_CLUSTER_ENABLED=false
    volumes:
      - ez_tro_uploads:/uploads:rw
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ez_tro_network

  nginx:
    build:
      context: ./ez_tro_app
      dockerfile: Dockerfile
      args: 
        REACT_APP_API_URL: /api
    image: ez-tro-app
    platform: linux/amd64
    ports:
      - "80:80"
    volumes:
      - ./ez_tro_app/nginx.conf:/etc/nginx/conf.d/default.conf
      - ez_tro_uploads:/uploads:ro
    depends_on:
      - backend
    networks:
      - ez_tro_network

  mysql:
    image: mysql:8
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ez_tro_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ez_tro_network
  minio:
    image: minio/minio:latest
    container_name: ez_tro_minio
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
        - ez_tro_network

volumes:
  mysql_data:
    driver: local
  ez_tro_uploads:
    driver: local
  minio_data:

networks:
  ez_tro_network:
    driver: bridge
