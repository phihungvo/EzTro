name: build-backend-image

on:
  workflow_call:
    inputs:
      image_name:
        description: Full Docker image name
        required: true
        type: string
      image_tag:
        description: Docker image tag
        required: true
        type: string
      push:
        description: Whether to push the image
        required: false
        type: boolean
        default: true
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_REF: ${{ inputs.push && format('{0}/{1}', secrets.DOCKER_USERNAME, inputs.image_name) || inputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ez_tro_api/pom.xml

      - name: Build backend jar
        working-directory: ez_tro_api
        run: ./mvnw clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE_REF }}:${{ inputs.image_tag }}
