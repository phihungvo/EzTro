name: deploy-vps

on:
  workflow_call:
    inputs:
      backend_tag:
        description: Backend image tag
        required: true
        type: string
      frontend_tag:
        description: Frontend image tag
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare SSH config
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare VPS directories
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "echo \"$VPS_PASSWORD\" | sudo -S mkdir -p /opt/ez-tro/nginx && echo \"$VPS_PASSWORD\" | sudo -S chown -R $VPS_USER:$VPS_USER /opt/ez-tro"

      - name: Upload deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=yes docker-compose.prod.yml "$VPS_USER@$VPS_HOST:/opt/ez-tro/docker-compose.prod.yml"
          sshpass -e scp -o StrictHostKeyChecking=yes nginx/nginx.conf "$VPS_USER@$VPS_HOST:/opt/ez-tro/nginx/nginx.conf"

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE || 'ez_tro_prod' }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION || '360000000' }}
          FILE_UPLOAD_DIR: ${{ vars.FILE_UPLOAD_DIR || '/uploads' }}
          REDIS_HOST: ${{ vars.REDIS_HOST || 'redis' }}
          REDIS_PORT: ${{ vars.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MINIO_URL: ${{ vars.MINIO_URL || 'http://minio:9000' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY || 'minioadmin' }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY || 'minioadmin' }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'ez-tro' }}
          MINIO_BASE_PATH: ${{ vars.MINIO_BASE_PATH || '/uploads' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DEBUG: ${{ vars.MAIL_DEBUG || 'false' }}
          APP_SEED_ENABLED: ${{ vars.APP_SEED_ENABLED || 'true' }}
          APP_SEED_RBAC_RESOURCE: ${{ vars.APP_SEED_RBAC_RESOURCE || 'classpath:seeds/rbac-seed.json' }}
          APP_SEED_SUBSCRIPTION_PLANS_RESOURCE: ${{ vars.APP_SEED_SUBSCRIPTION_PLANS_RESOURCE || 'classpath:seeds/subscription-plans-seed.json' }}
          APP_SEED_DEFAULT_PLAN_CODE: ${{ vars.APP_SEED_DEFAULT_PLAN_CODE || 'DEFAULT' }}
          APP_SEED_ADMIN_USERNAME: ${{ vars.APP_SEED_ADMIN_USERNAME || 'admin' }}
          APP_SEED_ADMIN_EMAIL: ${{ vars.APP_SEED_ADMIN_EMAIL || 'admin@example.com' }}
          APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD || 'admin123' }}
          APP_SEED_ADMIN_ROLE_NAME: ${{ vars.APP_SEED_ADMIN_ROLE_NAME || 'ADMIN' }}
        run: |
          shell_quote() {
            printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\"'\"'/g")"
          }

          sshpass -e ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -s" <<EOF
          set -euo pipefail
          cd /opt/ez-tro

          printf '%s\n' $(shell_quote "$DOCKER_PASSWORD") | docker login -u $(shell_quote "$DOCKER_USERNAME") --password-stdin

          export DOCKER_USERNAME=$(shell_quote "$DOCKER_USERNAME")
          export BACKEND_IMAGE_TAG=$(shell_quote "$BACKEND_TAG")
          export FRONTEND_IMAGE_TAG=$(shell_quote "$FRONTEND_TAG")
          export MYSQL_DATABASE=$(shell_quote "$MYSQL_DATABASE")
          export MYSQL_ROOT_PASSWORD=$(shell_quote "$MYSQL_ROOT_PASSWORD")
          export JWT_SECRET=$(shell_quote "$JWT_SECRET")
          export JWT_EXPIRATION=$(shell_quote "$JWT_EXPIRATION")
          export FILE_UPLOAD_DIR=$(shell_quote "$FILE_UPLOAD_DIR")
          export REDIS_HOST=$(shell_quote "$REDIS_HOST")
          export REDIS_PORT=$(shell_quote "$REDIS_PORT")
          export REDIS_PASSWORD=$(shell_quote "$REDIS_PASSWORD")
          export MINIO_URL=$(shell_quote "$MINIO_URL")
          export MINIO_ACCESS_KEY=$(shell_quote "$MINIO_ACCESS_KEY")
          export MINIO_SECRET_KEY=$(shell_quote "$MINIO_SECRET_KEY")
          export MINIO_BUCKET=$(shell_quote "$MINIO_BUCKET")
          export MINIO_BASE_PATH=$(shell_quote "$MINIO_BASE_PATH")
          export MAIL_USERNAME=$(shell_quote "$MAIL_USERNAME")
          export MAIL_PASSWORD=$(shell_quote "$MAIL_PASSWORD")
          export MAIL_DEBUG=$(shell_quote "$MAIL_DEBUG")
          export APP_SEED_ENABLED=$(shell_quote "$APP_SEED_ENABLED")
          export APP_SEED_RBAC_RESOURCE=$(shell_quote "$APP_SEED_RBAC_RESOURCE")
          export APP_SEED_SUBSCRIPTION_PLANS_RESOURCE=$(shell_quote "$APP_SEED_SUBSCRIPTION_PLANS_RESOURCE")
          export APP_SEED_DEFAULT_PLAN_CODE=$(shell_quote "$APP_SEED_DEFAULT_PLAN_CODE")
          export APP_SEED_ADMIN_USERNAME=$(shell_quote "$APP_SEED_ADMIN_USERNAME")
          export APP_SEED_ADMIN_EMAIL=$(shell_quote "$APP_SEED_ADMIN_EMAIL")
          export APP_SEED_ADMIN_PASSWORD=$(shell_quote "$APP_SEED_ADMIN_PASSWORD")
          export APP_SEED_ADMIN_ROLE_NAME=$(shell_quote "$APP_SEED_ADMIN_ROLE_NAME")

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml restart nginx
          EOF
