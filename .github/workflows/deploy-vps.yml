name: deploy-vps

on:
  workflow_call:
    inputs:
      backend_tag:
        description: Backend image tag
        required: true
        type: string
      frontend_tag:
        description: Frontend image tag
        required: true
        type: string
      minio_url:
        description: Public MinIO URL
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      VPS_HOST:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_PASSWORD:
        required: true
      MYSQL_DATABASE:
        required: true
      MYSQL_USER:
        required: true
      MYSQL_PASSWORD:
        required: true
      MYSQL_ROOT_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      JWT_EXPIRATION:
        required: true
      MINIO_ACCESS_KEY:
        required: true
      MINIO_SECRET_KEY:
        required: true
      MINIO_BUCKET:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH auth
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          trim_outer_quotes() {
            local value="$1"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then
              value="${value#\"}"
              value="${value%\"}"
            elif [[ "$value" == \'*\' && "$value" == *\' ]]; then
              value="${value#\'}"
              value="${value%\'}"
            fi
            printf '%s' "$value"
          }

          SANITIZED_VPS_HOST="$(trim_outer_quotes "$VPS_HOST")"
          SANITIZED_VPS_SSH_KEY="$(trim_outer_quotes "$VPS_SSH_KEY")"
          SANITIZED_VPS_PASSWORD="$(trim_outer_quotes "$VPS_PASSWORD")"
          printf 'VPS_HOST=%s\n' "$SANITIZED_VPS_HOST" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SANITIZED_VPS_HOST" >> ~/.ssh/known_hosts

          if [[ -n "$SANITIZED_VPS_PASSWORD" ]]; then
            printf 'SSH_AUTH_MODE=password\n' >> "$GITHUB_ENV"
            printf 'VPS_SSH_PASSWORD=%s\n' "$SANITIZED_VPS_PASSWORD" >> "$GITHUB_ENV"
          elif [[ "$SANITIZED_VPS_SSH_KEY" == *"BEGIN "* ]]; then
            printf '%s\n' "$SANITIZED_VPS_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            printf 'SSH_AUTH_MODE=key\n' >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
            printf 'SSH_AUTH_MODE=password\n' >> "$GITHUB_ENV"
            printf 'VPS_SSH_PASSWORD=%s\n' "$SANITIZED_VPS_SSH_KEY" >> "$GITHUB_ENV"
          fi

      - name: Prepare VPS directories
        env:
          VPS_USER: root
        run: |
          remote_ssh() {
            if [ "$SSH_AUTH_MODE" = "key" ]; then
              ssh -i ~/.ssh/id_rsa "$@"
            else
              sshpass -p "$VPS_SSH_PASSWORD" ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no "$@"
            fi
          }

          remote_ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -e
          mkdir -p /opt/ez-tro/nginx

          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg
            . /etc/os-release
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          fi

          systemctl enable --now docker >/dev/null 2>&1 || true
          docker compose version
          REMOTE

      - name: Upload deployment files
        env:
          VPS_USER: root
        run: |
          remote_scp() {
            if [ "$SSH_AUTH_MODE" = "key" ]; then
              scp -i ~/.ssh/id_rsa "$@"
            else
              sshpass -p "$VPS_SSH_PASSWORD" scp "$@"
            fi
          }

          remote_scp docker-compose.prod.yml "$VPS_USER@$VPS_HOST:/opt/ez-tro/docker-compose.prod.yml"
          remote_scp nginx/nginx.conf "$VPS_USER@$VPS_HOST:/opt/ez-tro/nginx/nginx.conf"

      - name: Deploy via SSH
        env:
          VPS_USER: root
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          MINIO_URL: ${{ inputs.minio_url }}
        run: |
          remote_ssh() {
            if [ "$SSH_AUTH_MODE" = "key" ]; then
              ssh -i ~/.ssh/id_rsa "$@"
            else
              sshpass -p "$VPS_SSH_PASSWORD" ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no "$@"
            fi
          }

          shell_quote() {
            printf "'%s'" "${1//\'/\'\\\'\'}"
          }

          DOCKER_USERNAME_ESCAPED="$(shell_quote "$DOCKER_USERNAME")"
          DOCKER_PASSWORD_ESCAPED="$(shell_quote "$DOCKER_PASSWORD")"
          MYSQL_DATABASE_ESCAPED="$(shell_quote "$MYSQL_DATABASE")"
          MYSQL_USER_ESCAPED="$(shell_quote "$MYSQL_USER")"
          MYSQL_PASSWORD_ESCAPED="$(shell_quote "$MYSQL_PASSWORD")"
          MYSQL_ROOT_PASSWORD_ESCAPED="$(shell_quote "$MYSQL_ROOT_PASSWORD")"
          JWT_SECRET_ESCAPED="$(shell_quote "$JWT_SECRET")"
          JWT_EXPIRATION_ESCAPED="$(shell_quote "$JWT_EXPIRATION")"
          MINIO_ACCESS_KEY_ESCAPED="$(shell_quote "$MINIO_ACCESS_KEY")"
          MINIO_SECRET_KEY_ESCAPED="$(shell_quote "$MINIO_SECRET_KEY")"
          MINIO_BUCKET_ESCAPED="$(shell_quote "$MINIO_BUCKET")"
          BACKEND_TAG_ESCAPED="$(shell_quote "$BACKEND_TAG")"
          FRONTEND_TAG_ESCAPED="$(shell_quote "$FRONTEND_TAG")"
          MINIO_URL_ESCAPED="$(shell_quote "$MINIO_URL")"

          remote_ssh "$VPS_USER@$VPS_HOST" "DOCKER_USERNAME=$DOCKER_USERNAME_ESCAPED DOCKER_PASSWORD=$DOCKER_PASSWORD_ESCAPED MYSQL_DATABASE=$MYSQL_DATABASE_ESCAPED MYSQL_USER=$MYSQL_USER_ESCAPED MYSQL_PASSWORD=$MYSQL_PASSWORD_ESCAPED MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD_ESCAPED JWT_SECRET=$JWT_SECRET_ESCAPED JWT_EXPIRATION=$JWT_EXPIRATION_ESCAPED MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY_ESCAPED MINIO_SECRET_KEY=$MINIO_SECRET_KEY_ESCAPED MINIO_BUCKET=$MINIO_BUCKET_ESCAPED BACKEND_TAG=$BACKEND_TAG_ESCAPED FRONTEND_TAG=$FRONTEND_TAG_ESCAPED MINIO_URL=$MINIO_URL_ESCAPED bash -se" <<'REMOTE'
          set -e
          cd /opt/ez-tro

          dump_diagnostics() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo '--- docker compose ps ---'
              docker compose -f docker-compose.prod.yml ps || true
              echo '--- mysql health ---'
              docker inspect ez_tro_mysql --format 'status={{.State.Health.Status}}' || true
              docker inspect ez_tro_mysql --format '{{range .State.Health.Log}}{{println .Start}}exit={{.ExitCode}}{{println .Output}}{{println "---"}}{{end}}' || true
              echo '--- mysql logs ---'
              docker logs ez_tro_mysql --tail 200 || true
            fi
            exit "$exit_code"
          }
          trap dump_diagnostics EXIT

          DEPLOY_MYSQL_USER="$MYSQL_USER"
          if [ "$DEPLOY_MYSQL_USER" = "root" ]; then
            DEPLOY_MYSQL_USER="eztro_app"
          fi
          MYSQL_USER="$DEPLOY_MYSQL_USER"

          cat > .env <<EOF
          DOCKER_USERNAME=$DOCKER_USERNAME
          BACKEND_IMAGE_TAG=$BACKEND_TAG
          FRONTEND_IMAGE_TAG=$FRONTEND_TAG
          REACT_APP_MINIO_URL=$MINIO_URL
          MYSQL_DATABASE=$MYSQL_DATABASE
          MYSQL_USER=$DEPLOY_MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          JWT_SECRET=$JWT_SECRET
          JWT_EXPIRATION=$JWT_EXPIRATION
          FILE_UPLOAD_DIR=/uploads
          REDIS_PASSWORD=
          MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
          MINIO_SECRET_KEY=$MINIO_SECRET_KEY
          MINIO_BUCKET=$MINIO_BUCKET
          MINIO_BASE_PATH=/uploads
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_DEBUG=false
          EOF

          printf '%s\n' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker compose -f docker-compose.prod.yml down --remove-orphans || true
          existing_port_80_containers="$(docker ps --filter publish=80 --format '{{.Names}}')"
          if [ -n "$existing_port_80_containers" ]; then
            printf '%s\n' "$existing_port_80_containers" | xargs -r docker stop
          fi
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
REMOTE
