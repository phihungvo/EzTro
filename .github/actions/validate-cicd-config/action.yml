name: Validate CI/CD config
description: Check required GitHub Secrets and Variables before running CD jobs.

inputs:
  docker_username:
    description: Docker Hub username
    required: true
  docker_password:
    description: Docker Hub password
    required: true
  vps_host:
    description: VPS host
    required: true
  vps_user:
    description: VPS SSH user
    required: true
  vps_ssh_key:
    description: VPS SSH private key
    required: true
  react_app_api_url:
    description: Frontend API URL
    required: true
  react_app_ws_url:
    description: Frontend WebSocket URL
    required: true
  react_app_minio_url:
    description: Frontend MinIO URL
    required: true

runs:
  using: composite
  steps:
    - name: Check required secrets and variables
      shell: bash
      env:
        DOCKER_USERNAME: ${{ inputs.docker_username }}
        DOCKER_PASSWORD: ${{ inputs.docker_password }}
        VPS_HOST: ${{ inputs.vps_host }}
        VPS_USER: ${{ inputs.vps_user }}
        VPS_SSH_KEY: ${{ inputs.vps_ssh_key }}
        REACT_APP_API_URL: ${{ inputs.react_app_api_url }}
        REACT_APP_WS_URL: ${{ inputs.react_app_ws_url }}
        REACT_APP_MINIO_URL: ${{ inputs.react_app_minio_url }}
      run: |
        missing=()

        for name in \
          DOCKER_USERNAME \
          DOCKER_PASSWORD \
          VPS_HOST \
          VPS_USER \
          VPS_SSH_KEY \
          REACT_APP_API_URL \
          REACT_APP_WS_URL \
          REACT_APP_MINIO_URL
        do
          if [ -z "${!name}" ]; then
            missing+=("$name")
          fi
        done

        if [ "${#missing[@]}" -gt 0 ]; then
          echo "Missing required CI/CD secrets or variables: ${missing[*]}"
          echo "Configure them in GitHub repo settings before running this workflow."
          exit 1
        fi
